<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Darko Boesmans, front-end developer and designer from Lebbeke, Belgium">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="280" rx="18"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.96  0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#151311"/>

    <!-- slow drifting colour fields -->
    <g filter="url(#soft)">
      <circle r="190" fill="#235347" opacity="0.9">
        <animate attributeName="cx" values="980;860;1040;980" dur="22s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;150;110;60" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle r="150" fill="#7a4f2e" opacity="0.85">
        <animate attributeName="cx" values="760;900;700;760" dur="27s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;190;270;240" dur="27s" repeatCount="indefinite"/>
      </circle>
      <circle r="90" fill="#f4f1ea" opacity="0.12">
        <animate attributeName="cx" values="1100;1000;1120;1100" dur="31s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;170;120;230" dur="31s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- contour lines, like a hiking map -->
    <g fill="none" stroke="#f4f1ea" stroke-opacity="0.09" stroke-width="1.2">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -40 4; 0 0" dur="24s" repeatCount="indefinite"/>
        <path d="M560 300 C 680 210, 760 250, 860 180 S 1060 120, 1260 150"/>
        <path d="M560 330 C 690 240, 780 280, 880 210 S 1080 150, 1260 185"/>
        <path d="M560 270 C 670 180, 740 220, 840 150 S 1040 90, 1260 115"/>
        <path d="M600 240 C 700 160, 760 190, 850 125 S 1030 60, 1260 80"/>
        <path d="M640 210 C 720 140, 780 160, 860 100 S 1020 30, 1260 45"/>
      </g>
    </g>

    <rect width="1200" height="280" filter="url(#grain)"/>
  </g>

  <!-- text -->
  <g font-family="'Space Grotesk', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#b07a4a" font-size="15" letter-spacing="4" font-weight="600">
      DESIGN ENGINEER · FRONT-END DEVELOPER
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="60" y="160" fill="#f4f1ea" font-size="68" font-weight="700" letter-spacing="-1.5">
      Darko Boesmans
      <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
    </text>
    <text x="64" y="204" fill="#f4f1ea" fill-opacity="0.72" font-size="20">
      Designing it in Figma, then building it myself. Lebbeke, Belgium.
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.2s" fill="freeze"/>
    </text>
  </g>
</svg>
